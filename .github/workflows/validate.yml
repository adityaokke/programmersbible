name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate content and graph
        run: npm run validate
      - name: Typecheck
        run: npm run typecheck
      # Mermaid diagrams are drawn into SVG at build time in a headless browser.
      - name: Install Chromium for diagrams
        run: npx playwright install --with-deps chromium
      - name: Build site
        run: npm run build:site
      - name: Accessibility check (axe-core, light and dark)
        run: npm run a11y
